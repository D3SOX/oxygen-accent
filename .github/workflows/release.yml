name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v6.8.0-1
        required: true
        type: string
      publish:
        description: Publish the release after packaging
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Package both themes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ./package.sh "$RELEASE_TAG"
      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/oxygen-release-draft; then
            if [ "$(cat /tmp/oxygen-release-draft)" = false ]; then
              echo 'The GitHub release is already published.'
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/oxygen-accent-plasma.tar.gz dist/oxygen-accent-icons.tar.gz \
              --verify-tag --draft --title "Oxygen Accent ${RELEASE_TAG#v}" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
