name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v6.8.0-1
        required: true
        type: string
      publish:
        description: Publish the release after packaging
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Package both themes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ./package.sh "$RELEASE_TAG"
      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/oxygen-release-draft; then
            if [ "$(cat /tmp/oxygen-release-draft)" = false ]; then
              echo 'The GitHub release is already published. Continuing with KDE Store.'
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/oxygen-accent-plasma.tar.gz dist/oxygen-accent-icons.tar.gz \
              --verify-tag --draft --title "Oxygen Accent ${RELEASE_TAG#v}" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest

  kde-store:
    needs: release
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: kde-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Check publishing credentials
        env:
          KDE_STORE_USERNAME: ${{ secrets.KDE_STORE_USERNAME }}
          KDE_STORE_PASSWORD: ${{ secrets.KDE_STORE_PASSWORD }}
        run: |
          if [ -z "$KDE_STORE_USERNAME" ] || [ -z "$KDE_STORE_PASSWORD" ]; then
            echo '::error::Add KDE_STORE_USERNAME and KDE_STORE_PASSWORD in the repository Actions secrets, then rerun this job.'
            exit 1
          fi
      - run: bunx playwright install --with-deps chromium
      - name: Publish versioned KDE Store entries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          KDE_STORE_USERNAME: ${{ secrets.KDE_STORE_USERNAME }}
          KDE_STORE_PASSWORD: ${{ secrets.KDE_STORE_PASSWORD }}
        run: node .github/scripts/kde-store.mjs
